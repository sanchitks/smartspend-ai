# Render blueprint for the SmartSpend API. Secrets (DATABASE_URL, JWT_SECRET_KEY, ANTHROPIC_API_KEY) are set in the
# Render dashboard or API, never in this file.
services:
  - type: web
    name: smartspend-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run on every start; --proxy-headers makes rate limits see the real client IP behind Render's proxy.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: APP_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://sanchitks.github.io
      - key: AI_PROVIDER
        value: auto
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
